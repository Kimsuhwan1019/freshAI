name: fresh_ai
description: "FreshAI - 스마트 냉장고 식재료 관리 앱"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.8.4
  image_picker: ^1.1.2
  http: ^1.2.2
  intl: ^0.19.0
  shared_preferences: ^2.3.3
  cached_network_image: ^3.4.1
  flutter_dotenv: ^5.2.1
  google_sign_in: ^6.2.1
  geolocator: ^13.0.2
  url_launcher: ^6.3.1
  flutter_local_notifications: ^22.0.0
  workmanager: ^0.9.0+3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icons/app_icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/icons/
